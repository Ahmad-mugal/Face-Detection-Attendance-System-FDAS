<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FDAS Login - Govt. Islamia Graduate College</title>

                    "surface-bright": "#fff8f6",

                    "secondary-fixed-dim": "#f6be39",
                    "on-tertiary-container": "#fffbff",
                    "on-secondary-fixed-variant": "#5c4300",
                    "primary-fixed": "#ffdbcb",
                    "tertiary-fixed-dim": "#ffb780",
                    "surface-container-highest": "#f0dfd8",
                    "tertiary-fixed": "#ffdcc4",

                    "on-primary-fixed": "#341100"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "container-max": "1280px",
                    "base": "8px",
                    "lg": "48px",
                    "gutter": "24px",
                    "xl": "80px",
                    "md": "24px",
                    "sm": "12px"
            },
            "fontFamily": {
                    "caption": [
                            "Plus Jakarta Sans"
                    ],
                    "body-lg": [

                    ],
                    "label-bold": [

                    ],
                    "h3": [

                    ],

<body class="bg-background min-h-screen flex items-center justify-center p-md lg:p-lg antialiased">
<!-- Main Container -->
<main class="w-full max-w-container-max min-h-[819px] flex flex-col lg:flex-row shadow-[0_8px_30px_rgb(232,146,74,0.15)] rounded-xl overflow-hidden bg-background">
<!-- Left Panel: Branding & Visuals -->
<section class="lg:w-1/2 relative flex flex-col items-center justify-center p-xl overflow-hidden min-h-[400px] lg:min-h-full" style="background: linear-gradient(135deg, #FFF0E6 0%, #F5C49A 100%);">
<!-- Decorative Mandala/Glow -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
<div class="w-96 h-96 rounded-full border-[2px] border-amber-400/30 flex items-center justify-center">
<div class="w-72 h-72 rounded-full border-[4px] border-amber-500/40 flex items-center justify-center">
<div class="w-48 h-48 rounded-full border-[8px] border-amber-600/50 flex items-center justify-center bg-amber-500/10 backdrop-blur-sm">
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'FILL' 0;">face</span>
</div>
</div>
</div>
</div>
<div class="relative z-10 text-center mt-auto mb-auto">
<h1 class="font-h1 text-h1 text-on-surface mb-sm">FDAS</h1>
<p class="font-body-lg text-body-lg text-tertiary-container font-medium">Automated Attendance. Zero Effort.</p>
</div>
<div class="relative z-10 text-center mt-auto pt-lg">
<p class="font-label-bold text-label-bold text-primary opacity-80 uppercase tracking-wider">Govt. Islamia Graduate College, Gujranwala</p>
</div>
</section>
<!-- Right Panel: Login Form -->
<section class="lg:w-1/2 flex items-center justify-center p-md lg:p-xl bg-background">
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(232,146,74,0.15)] border-t-[4px] border-[#D4A017] p-xl flex flex-col gap-lg relative">
<header class="text-center">
<h2 class="font-h2 text-h2 text-primary mb-xs">Admin Access</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage attendance</p>
</header>
<form class="flex flex-col gap-md">
<!-- Username Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-xs" for="username">Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-secondary-container" style="font-variation-settings: 'FILL' 1;">person</span>
<input class="w-full bg-surface-container-lowest border border-outline rounded-lg py-sm pr-sm pl-xl font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#E8924A] focus:border-[#E8924A] transition-all" id="username" name="username" placeholder="Enter admin username" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-xs" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-secondary-container" style="font-variation-settings: 'FILL' 1;">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline rounded-lg py-sm pr-xl pl-xl font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#E8924A] focus:border-[#E8924A] transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm text-primary hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary-container transition-all" type="checkbox"/>
<span class="font-caption text-caption text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-caption text-caption text-primary hover:text-primary-container underline underline-offset-2 transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="mt-md w-full bg-primary hover:bg-primary-container text-on-primary font-label-bold text-label-bold py-sm px-md rounded-lg shadow-sm hover:shadow-[0_4px_15px_rgb(232,146,74,0.3)] transition-all transform hover:-translate-y-0.5 active:translate-y-0" type="submit">
                        Sign In
                    </button>
</form>
<!-- Error Message Area (Example hidden state, remove 'hidden' to see) -->
<div class="hidden bg-error-container border border-error/20 rounded-lg p-sm flex items-start gap-sm">
<span class="material-symbols-outlined text-error mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-caption text-caption text-on-error-container">Invalid username or password. Please try again.</p>
</div>
</div>
</section>
</main>
</body></html>
